<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" /><title>Dapora Admin</title>
  <meta name="theme-color" content="#FBF8F2" />
  <meta name="application-name" content="Dapora Admin" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Dapora" /><meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/manifest.webmanifest" /><link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" /><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <!-- Terapkan tema sebelum halaman digambar (mencegah kilatan putih pada mode gelap) -->
  <script>(function(){try{var p=localStorage.getItem('admin_theme'),d=p==='dark'||(p!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';var m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#171F1B':'#FBF8F2'}catch(e){}})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="adm"><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
